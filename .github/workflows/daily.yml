name: Daily NBA report

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Get stats
        run: python nba_boxscores.py
      - name: Save to the repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports
          git commit -m "Box scores $(date -u +%F)" || echo "Nothing new to save"
          git pull --rebase
          git push
