name: Daily NBA report

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Get stats
        run: python nba_boxscores.py
      - name: Get injury report
        continue-on-error: true
        run: |
          pip install nbainjuries
          python nba_injuries.py
      - name: Save to the repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports
          git commit -m "Box scores and injuries $(date -u +%F)" || echo "Nothing new to save"
          git pull --rebase
          git push
